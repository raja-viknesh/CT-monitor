[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctmonitor"
version = "0.1.0"
description = "Production-grade, local-first certificate transparency monitoring engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Raja Viknesh", email = "rajaviknesh.off@gmail.com"}
]

dependencies = [
  # Ingestion
  "certstream>=1.11",
  "aiohttp>=3.9",
  "websockets>=12.0",
  "tldextract>=5.1",
  "python-whois>=0.9",

  # Heuristics
  "rapidfuzz>=3.6",
  "PyYAML>=6.0",

  # ML (CPU-only PyTorch to respect 3GB storage constraint)
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "torch-geometric>=2.5",
  "onnx>=1.16",
  "onnxruntime>=1.17",
  "joblib>=1.3",

  # Storage
  "aiosqlite>=0.20",

  # Serving
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "sse-starlette>=2.1",

  # Utilities
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.8",
    "black>=24.1",
    "ruff>=0.3",
]

[project.scripts]
ctmonitor = "ctmonitor.cli:app"

[tool.setuptools]
packages = ["ctmonitor"]

[tool.setuptools.package-data]
ctmonitor = [
    "data/*",
    "dashboard/*",
    "extension/*",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
