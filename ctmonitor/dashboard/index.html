<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CT Monitor Dashboard</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #f0f0f0; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
        .tier-BLOCK { color: #ff4a4a; font-weight: bold; }
        .tier-WARN { color: #ffb84a; font-weight: bold; }
        .tier-WATCH { color: #4aa1ff; }
        .tier-SAFE { color: #4aff8b; }
        input[type="text"] { width: calc(100% - 100px); padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; }
        button { padding: 10px 15px; background: #4aa1ff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #3a81cc; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>CT Monitor Edge Runtime</h2>
            <div id="status" style="color: #4aff8b;">🔴 Disconnected</div>
        </div>
        
        <div class="grid">
            <div class="panel">
                <h3>Live Stream (Top 50)</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Domain</th>
                            <th>Risk Score</th>
                            <th>Tier</th>
                        </tr>
                    </thead>
                    <tbody id="stream-table">
                        <!-- Populated by main.js via SSE -->
                    </tbody>
                </table>
            </div>
            
            <div class="panel">
                <h3>Manual Analysis</h3>
                <div>
                    <input type="text" id="domain-input" placeholder="Enter domain (e.g., paypal-secure.com)">
                    <button onclick="analyzeDomain()">Analyze</button>
                </div>
                
                <h4 style="margin-top: 20px; border-bottom: 1px solid #333; padding-bottom: 5px;">Detector Heatmap & Evidence</h4>
                <div id="heatmap-container" style="display: flex; gap: 10px; margin-top: 10px;">
                    <!-- Detector heat blocks inserted here -->
                </div>
                
                <pre id="analysis-result" style="background:#000; padding:15px; border-radius:4px; margin-top: 15px; overflow-x: auto; font-size: 13px;">Awaiting input...</pre>
            </div>
        </div>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
