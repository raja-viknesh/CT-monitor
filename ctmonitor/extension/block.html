<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTMonitor Blocked Navigation</title>
    <style>
        body { margin: 0; font-family: Segoe UI, system-ui, sans-serif; background: #200a0a; color: #fee2e2; }
        .wrap { max-width: 760px; margin: 28px auto; padding: 0 16px; }
        .panel { background: #2d0e0e; border: 1px solid #7f1d1d; border-radius: 12px; padding: 16px; }
        .muted { color: #fecaca; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
        button { border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 700; }
        .danger { background: #dc2626; color: #fff; }
        .safe { background: #2563eb; color: #fff; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="panel">
            <h2 style="margin-top:0;">Potentially harmful page blocked</h2>
            <div class="muted">CTMonitor detected a BLOCK-tier risk for this navigation.</div>
            <p><strong>Domain:</strong> <span id="domain">unknown</span></p>
            <div class="actions">
                <button id="continue-btn" class="danger">Continue Anyway (once)</button>
                <button id="back-btn" class="safe">Go To Safety</button>
                <button id="report-btn" class="safe">View Report</button>
            </div>
            <p id="status" class="muted"></p>
        </div>
    </div>
    <script src="block.js"></script>
</body>
</html>
